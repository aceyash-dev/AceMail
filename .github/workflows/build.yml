name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. The one job that writes to the repository asks for
# `contents: write` on itself, and only runs when this is not a pull request —
# so a PR from anywhere can never touch a release or the signing key.
permissions:
  contents: read

jobs:
  build:
    name: Analyze, test, build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gradle's own caches, which the Flutter action does not cover. Without
      # this every run re-resolves the Android Gradle plugin and re-downloads
      # its dependencies — most of the build's wall-clock time — and a change to
      # the native code, which invalidates more of it, can push the job past its
      # own timeout.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The keystore and its passwords live in repository secrets, never in the
      # repo. Pull requests are built with the debug key on purpose: a PR has no
      # business producing an artifact signed with the key that ships releases.
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A run that publishes must be signed with the release key. Falling
          # back to the debug key here would ship a build that cannot update an
          # installed app, and that Play would reject.
          PUBLISHING="no"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PUBLISHING="yes"
          fi

          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$PUBLISHING" = "yes" ]; then
              echo "::error::Release signing secrets are missing; refusing to publish a debug-signed APK."
              exit 1
            fi
            echo "::warning::No release keystore secret found - falling back to debug signing."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android/ace-release.jks
          {
            echo "storeFile=ace-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured."

      - name: Note the signing mode
        if: github.event_name == 'pull_request'
        run: echo "Pull request build - debug key, no release secrets used."

      # Split per ABI. One APK carrying both arm sets is about twice the size of
      # either, and every device downloads the half it cannot run.
      #
      # arm only: x86/x86_64 are emulator and ChromeOS images, and shipping them
      # just inflates the download. Flutter picks the ABIs, not Gradle.
      #
      # Validation and publishing are kept apart: a pull request builds the
      # debug APKs, and only a run that can publish builds — and signs — the
      # release ones.
      - name: Build the release APKs
        if: github.event_name != 'pull_request'
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64
          ls -l build/app/outputs/flutter-apk/

      - name: Build the debug APKs for a pull request
        if: github.event_name == 'pull_request'
        run: |
          flutter build apk --debug --split-per-abi \
            --target-platform android-arm,android-arm64

      # Fail closed. A publishing run must *prove* every APK carries the
      # expected release key: a missing fingerprint secret, or an APK whose
      # certificate cannot be read, is a failure — not a check quietly skipped.
      - name: Verify the signer
        if: github.event_name != 'pull_request'
        env:
          EXPECTED: ${{ secrets.ANDROID_KEY_SHA256 }}
        run: |
          PUBLISHING="no"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PUBLISHING="yes"
          fi

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # Normalised: a fingerprint is the same bytes however it is written.
          EXPECTED_NORM=$(echo "$EXPECTED" | tr -d ':' | tr 'A-Z' 'a-z')

          # Both halves of the split, because a split is where an APK that was
          # never signed can hide behind one that was.
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "--- $APK"
            "$BT/apksigner" verify --print-certs "$APK" \
              | grep -E "certificate DN|SHA-256" || true

            ACTUAL=$("$BT/apksigner" verify --print-certs "$APK" \
              | grep -m1 "SHA-256 digest" | awk '{print $NF}' \
              | tr -d ':' | tr 'A-Z' 'a-z')
            echo "signer sha256: $ACTUAL"

            if [ -z "$ACTUAL" ]; then
              echo "::error::Could not read $APK's signing certificate."
              exit 1
            fi

            if [ "$PUBLISHING" = "yes" ] && [ -z "$EXPECTED_NORM" ]; then
              echo "::error::ANDROID_KEY_SHA256 is not set; refusing to publish a build whose signer cannot be checked."
              exit 1
            fi

            if [ -n "$EXPECTED_NORM" ] && [ "$ACTUAL" != "$EXPECTED_NORM" ]; then
              echo "::error::$APK is not signed with the expected release key."
              exit 1
            fi
          done

      # Renamed on the way out: `app-arm64-v8a-release.apk` is Flutter's name
      # for a build step, and `AceMail-0.5.2-arm64-v8a.apk` is a name somebody
      # can choose between in a list of downloads.
      - name: Name the APKs
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | cut -d+ -f1)
          cd build/app/outputs/flutter-apk
          for ABI in armeabi-v7a arm64-v8a; do
            mv "app-$ABI-release.apk" "AceMail-$VERSION-$ABI.apk"
          done
          ls -l

      - name: Upload the APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ace-mail-apks
          path: build/app/outputs/flutter-apk/AceMail-*.apk
          if-no-files-found: error

      - name: Upload the debug APKs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ace-mail-debug-apks
          path: build/app/outputs/flutter-apk/app-*-debug.apk
          if-no-files-found: error

  # The other two platforms. Separate jobs because each needs a different
  # machine, and a failure in one must not stop the others from being
  # published — a build that works is worth more than a tidy run.
  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # What the Linux embedder links against. Without these, `flutter build
      # linux` fails at CMake rather than at the app.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev

      - name: Install dependencies
        run: flutter pub get

      # The desktop Google client, from secrets. Without them the app still
      # builds, and Gmail sign-in on this build says it is not configured.
      - name: Build
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          flutter build linux --release \
            --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID" \
            --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"

      - name: Pack the bundle
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | cut -d+ -f1)
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/AceMail-$VERSION-linux-x64.tar.gz" bundle
          ls -l "$GITHUB_WORKSPACE"/AceMail-*.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ace-mail-linux
          path: AceMail-*-linux-x64.tar.gz
          if-no-files-found: error

  ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The iOS runner is not committed. tool/ios/setup_ios.sh generates it from
      # Flutter's template and applies Ace Mail's iOS settings (permissions, the
      # background check, the bundle ID, the voice channel). Doing it here means
      # a change that breaks that configuration fails this job.
      - name: Generate and configure the iOS runner
        env:
          IOS_GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_CLIENT_ID }}
        run: tool/ios/setup_ios.sh

      # Unsigned on purpose: signing needs a certificate and a provisioning
      # profile that live in somebody's Apple account, and this repository does
      # not have them. An unsigned build is what an Xcode user re-signs, and it
      # is also the check that the app compiles for iOS at all.
      - name: Build
        run: flutter build ios --release --no-codesign

      - name: Pack the app
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | cut -d+ -f1)
          cd build/ios/iphoneos
          # -y keeps the symlinks: a .app that has been dereferenced is a much
          # bigger file, and one Xcode may refuse.
          zip -qry "$GITHUB_WORKSPACE/AceMail-$VERSION-ios-unsigned.zip" Runner.app
          ls -l "$GITHUB_WORKSPACE"/AceMail-*.zip

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ace-mail-ios
          path: AceMail-*-ios-unsigned.zip
          if-no-files-found: error

  # Windows and macOS. Neither runner is committed; tool/desktop/setup_desktop.sh
  # generates them from Flutter's template and applies the settings each needs —
  # the macOS network entitlement above all, without which a sandboxed build
  # reaches no IMAP server and every mailbox looks like a wrong password.
  windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate the Windows runner
        shell: bash
        run: tool/desktop/setup_desktop.sh windows

      - name: Build
        run: flutter build windows --release

      - name: Pack the app
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | cut -d+ -f1)
          cd build/windows/x64/runner/Release
          powershell -Command "Compress-Archive -Path * -DestinationPath \"$GITHUB_WORKSPACE/AceMail-$VERSION-windows-x64.zip\""
          ls -l "$GITHUB_WORKSPACE"/AceMail-*.zip

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ace-mail-windows
          path: AceMail-*-windows-x64.zip
          if-no-files-found: error

  macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate the macOS runner
        run: tool/desktop/setup_desktop.sh macos

      # Unsigned, like the iOS build: signing needs a certificate and a
      # provisioning profile this repository does not have. An unsigned .app is
      # what an Xcode user re-signs, and it is also the check that it compiles.
      - name: Build
        run: flutter build macos --release

      - name: Pack the app
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | cut -d+ -f1)
          cd build/macos/Build/Products/Release
          zip -qry "$GITHUB_WORKSPACE/AceMail-$VERSION-macos-unsigned.zip" "ace_mail.app"
          ls -l "$GITHUB_WORKSPACE"/AceMail-*.zip

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ace-mail-macos
          path: AceMail-*-macos-unsigned.zip
          if-no-files-found: error

  release:
    name: Publish
    # It waits for all three — the artifacts have to exist before they can be
    # attached — but `always()` with a check on the Android build alone means a
    # Linux or iOS failure does not stop the APKs from being published.
    needs: [build, linux, ios, windows, macos]
    if: always() && needs.build.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The notes are read from the changelog in the repo, so this job needs the
      # repo, not just the artifacts.
      - uses: actions/checkout@v7

      - name: Download the APKs
        uses: actions/download-artifact@v8
        with:
          name: ace-mail-apks
          path: apk

      # Optional: a platform that failed to build is skipped rather than failing
      # the release. The notes are already written by this point.
      - name: Download the Linux build
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ace-mail-linux
          path: linux

      - name: Download the Windows build
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ace-mail-windows
          path: windows

      - name: Download the macOS build
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ace-mail-macos
          path: macos

      - name: Download the iOS build
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ace-mail-ios
          path: ios

      # The body is generated from CHANGELOG.md at release time, so it cannot
      # drift from the changelog the app itself shows. The self-test runs first:
      # a broken generator fails the release rather than publishing notes that
      # are wrong.
      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 tool/release_notes.py --self-test
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          python3 tool/release_notes.py \
            --match "${GITHUB_REF_NAME#v}" \
            --title "$GITHUB_REF_NAME" \
            --version "$VERSION" > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      # A version tag is a real release; the rolling `apk-latest` tag is a
      # pre-release that the next build replaces.
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            apk/AceMail-*.apk
            linux/AceMail-*.tar.gz
            ios/AceMail-*.zip
            windows/AceMail-*.zip
            macos/AceMail-*.zip
          fail_on_unmatched_files: false
          prerelease: false

      - name: Publish the rolling build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-latest
          name: Latest build
          body: |
            Built automatically from `${{ github.sha }}`.
          files: |
            apk/AceMail-*.apk
            linux/AceMail-*.tar.gz
            ios/AceMail-*.zip
          fail_on_unmatched_files: false
          prerelease: true
