name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. The one job that writes to the repository asks for
# `contents: write` on itself, and only runs when this is not a pull request —
# so a PR from anywhere can never touch a release or the signing key.
permissions:
  contents: read

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The keystore and its passwords live in repository secrets, never in the
      # repo. Pull requests are built with the debug key on purpose: a PR has no
      # business producing an artifact signed with the key that ships releases.
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A run that publishes must be signed with the release key. Falling
          # back to the debug key here would ship a build that cannot update an
          # installed app, and that Play would reject.
          PUBLISHING="no"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PUBLISHING="yes"
          fi

          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$PUBLISHING" = "yes" ]; then
              echo "::error::Release signing secrets are missing; refusing to publish a debug-signed APK."
              exit 1
            fi
            echo "::warning::No release keystore secret found - falling back to debug signing."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android/ace-release.jks
          {
            echo "storeFile=ace-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured."

      - name: Note the signing mode
        if: github.event_name == 'pull_request'
        run: echo "Pull request build - debug key, no release secrets used."

      # arm only: x86/x86_64 are emulator and ChromeOS images, and shipping
      # them just inflates the download. Flutter picks the ABIs, not Gradle.
      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug --target-platform android-arm,android-arm64

      - name: Verify the signer
        if: github.event_name != 'pull_request'
        env:
          EXPECTED: ${{ secrets.ANDROID_KEY_SHA256 }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "certificate DN|SHA-256" || true

          ACTUAL=$("$BT/apksigner" verify --print-certs "$APK" \
            | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "signer sha256: $ACTUAL"
          PUBLISHING="no"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PUBLISHING="yes"
          fi

          if [ "$PUBLISHING" = "yes" ]; then
            if [ -z "$EXPECTED" ]; then
              echo "::error::ANDROID_KEY_SHA256 is required for release publication."
              exit 1
            fi
            if [ -z "$ACTUAL" ]; then
              echo "::error::Could not read the APK signer fingerprint."
              exit 1
            fi
          fi

          if [ -n "$EXPECTED" ]; then
            EXPECTED_NORMALIZED=$(printf '%s' "$EXPECTED" | tr -d ':' | tr '[:upper:]' '[:lower:]')
            ACTUAL_NORMALIZED=$(printf '%s' "$ACTUAL" | tr -d ':' | tr '[:upper:]' '[:lower:]')
            if [ -z "$ACTUAL_NORMALIZED" ] || [ "$ACTUAL_NORMALIZED" != "$EXPECTED_NORMALIZED" ]; then
              echo "::error::The APK is not signed with the expected release key."
              exit 1
            fi
          fi

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ace-mail-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ace-mail-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # The README claims four desktop platforms; this is the one that can actually
  # be built on a hosted runner, so it is the one that is checked. iOS and macOS
  # need macOS runners and Windows needs a Windows runner — neither is claimed
  # here, and the README says so.
  desktop:
    name: Linux desktop build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Linux desktop scaffold
        run: |
          if [ ! -d linux ]; then
            flutter create --platforms=linux .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux desktop
        run: flutter build linux --release

      - name: Upload the Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: ace-mail-linux
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  # Publishing is its own job, so the only step that can write to the repository
  # is one that never runs on a pull request.
  release:
    name: Publish the APK
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: ace-mail-apk
          path: apk

      - name: Attach APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'apk-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest APK' }}
          body: |
            Release APK built automatically from `${{ github.sha }}`.
          files: apk/app-release.apk
          prerelease: true
