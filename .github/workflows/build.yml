name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The keystore and its passwords live in repository secrets, never in the
      # repo. Without them the build still succeeds, signed with the debug key.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A run that publishes must be signed with the release key. Falling
          # back to the debug key here would ship a build that cannot update an
          # installed app, and that Play would reject.
          PUBLISHING="no"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PUBLISHING="yes"
          fi

          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$PUBLISHING" = "yes" ]; then
              echo "::error::Release signing secrets are missing; refusing to publish a debug-signed APK."
              exit 1
            fi
            echo "::warning::No release keystore secret found - falling back to debug signing."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android/ace-release.jks
          {
            echo "storeFile=ace-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured."

      # arm only: x86/x86_64 are emulator and ChromeOS images, and shipping
      # them just inflates the download. Flutter picks the ABIs, not Gradle.
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Verify the signer
        env:
          EXPECTED: ${{ secrets.ANDROID_KEY_SHA256 }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "certificate DN|SHA-256" || true

          ACTUAL=$("$BT/apksigner" verify --print-certs "$APK" \
            | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "signer sha256: $ACTUAL"
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The APK is not signed with the expected release key."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-mail-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # On a manual run or a version tag, also publish the APK so it can be
      # downloaded without signing in to GitHub.
      - name: Attach APK to a release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'apk-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest APK' }}
          body: |
            Release APK built automatically from `${{ github.sha }}`.
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
