name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. The one job that writes to the repository asks for
# `contents: write` on itself, and only runs when this is not a pull request —
# so a PR from anywhere can never touch a release or the signing key.
permissions:
  contents: read

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gradle's own caches, which the Flutter action does not cover. Without
      # this every run re-resolves the Android Gradle plugin and re-downloads
      # its dependencies — most of the build's wall-clock time — and a change to
      # the native code, which invalidates more of it, can push the job past its
      # own timeout.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Keyed on the files that decide what Gradle will resolve, so a
          # dependency change starts a new cache rather than restoring a stale
          # one and re-downloading anyway.
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The keystore and its passwords live in repository secrets, never in the
      # repo. Pull requests are built with the debug key on purpose: a PR has no
      # business producing an artifact signed with the key that ships releases.
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A run that publishes must be signed with the release key. Falling
          # back to the debug key here would ship a build that cannot update an
          # installed app, and that Play would reject.
          PUBLISHING="no"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PUBLISHING="yes"
          fi

          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$PUBLISHING" = "yes" ]; then
              echo "::error::Release signing secrets are missing; refusing to publish a debug-signed APK."
              exit 1
            fi
            echo "::warning::No release keystore secret found - falling back to debug signing."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android/ace-release.jks
          {
            echo "storeFile=ace-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured."

      - name: Note the signing mode
        if: github.event_name == 'pull_request'
        run: echo "Pull request build - debug key, no release secrets used."

      # arm only: x86/x86_64 are emulator and ChromeOS images, and shipping
      # them just inflates the download. Flutter picks the ABIs, not Gradle.
      #
      # Validation and publishing are kept apart: a pull request builds the
      # debug APK, and only a run that can publish builds — and signs — the
      # release one.
      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Build debug APK for a pull request
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug --target-platform android-arm,android-arm64

      # Fail closed. A publishing run must *prove* the APK carries the expected
      # release key: a missing fingerprint secret, or an APK whose certificate
      # cannot be read, is a failure — not a check quietly skipped.
      - name: Verify the signer
        if: github.event_name != 'pull_request'
        env:
          EXPECTED: ${{ secrets.ANDROID_KEY_SHA256 }}
        run: |
          PUBLISHING="no"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PUBLISHING="yes"
          fi

          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "certificate DN|SHA-256" || true

          # Normalised: a fingerprint is the same bytes however it is written.
          ACTUAL=$("$BT/apksigner" verify --print-certs "$APK" \
            | grep -m1 "SHA-256 digest" | awk '{print $NF}' \
            | tr -d ':' | tr 'A-Z' 'a-z')
          EXPECTED_NORM=$(echo "$EXPECTED" | tr -d ':' | tr 'A-Z' 'a-z')
          echo "signer sha256: $ACTUAL"

          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read the APK's signing certificate."
            exit 1
          fi

          if [ "$PUBLISHING" = "yes" ] && [ -z "$EXPECTED_NORM" ]; then
            echo "::error::ANDROID_KEY_SHA256 is not set; refusing to publish a build whose signer cannot be checked."
            exit 1
          fi

          if [ -n "$EXPECTED_NORM" ] && [ "$ACTUAL" != "$EXPECTED_NORM" ]; then
            echo "::error::The APK is not signed with the expected release key."
            exit 1
          fi

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ace-mail-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload the debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ace-mail-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # Linux is built on every run, so the desktop target cannot rot unnoticed.
  # The desktop Google client is passed in from secrets at build time; without
  # them the app still builds, and Gmail sign-in says it is not configured.
  linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux toolchain and libsecret
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux (release)
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          flutter build linux --release \
            --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID" \
            --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"

      - name: Upload the Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: ace-mail-linux
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  # iOS is built on a macOS runner and left unsigned. This proves the app
  # compiles and links for iPhone, which is what can silently rot. Signing and
  # distribution need an Apple developer account and are not part of CI yet.
  # The runner is generated here from Flutter's template by tool/ios/setup_ios.sh,
  # so a change that breaks the iOS configuration fails this job.
  ios:
    name: Build for iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate and configure the iOS runner
        env:
          IOS_GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_CLIENT_ID }}
        run: tool/ios/setup_ios.sh

      - name: Build iOS (unsigned, debug)
        run: flutter build ios --no-codesign --debug

  release:
    name: Publish the APK
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The notes are read from the changelog in the repo, so this job needs the
      # repo, not just the artifact.
      - uses: actions/checkout@v4

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: ace-mail-apk
          path: apk

      # The body is generated from CHANGELOG.md at release time, so it cannot
      # drift from the changelog the app itself shows. The self-test runs first:
      # a broken generator fails the release rather than publishing notes that
      # are wrong.
      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 tool/release_notes.py --self-test
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          python3 tool/release_notes.py \
            --match "${GITHUB_REF_NAME#v}" \
            --title "$GITHUB_REF_NAME" \
            --version "$VERSION" > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      # A version tag is a real release; the rolling `apk-latest` tag is a
      # pre-release that the next build replaces.
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: apk/app-release.apk
          prerelease: false

      - name: Publish the rolling APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK
          body: |
            Release APK built automatically from `${{ github.sha }}`.
          files: apk/app-release.apk
          prerelease: true
