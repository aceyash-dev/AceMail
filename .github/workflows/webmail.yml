name: AceMail Web

on:
  push:
    branches: [main]
    paths:
      - 'webmail/**'
      - '.github/workflows/webmail.yml'
  pull_request:
    branches: [main]
    paths:
      - 'webmail/**'
      - '.github/workflows/webmail.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ace-mail-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: webmail
        run: flutter pub get
      - name: Analyze Dart
        working-directory: webmail
        run: flutter analyze --fatal-infos
      - name: Run tests
        working-directory: webmail
        run: flutter test
      - name: Build Flutter Web
        working-directory: webmail
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ACEMAIL_API_BASE_URL: ${{ secrets.ACEMAIL_API_BASE_URL }}
        run: |
          test -n "$GOOGLE_WEB_CLIENT_ID" || { echo 'Missing repository variable GOOGLE_WEB_CLIENT_ID'; exit 1; }
          test -n "$ACEMAIL_API_BASE_URL" || { echo 'Missing repository secret ACEMAIL_API_BASE_URL'; exit 1; }
          flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=ACEMAIL_API_BASE_URL="$ACEMAIL_API_BASE_URL"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: webmail/build/web
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
