# More heap than the Flutter template's 1.5G: the release build runs the Kotlin
# compiler and D8, and both are the tasks that get squeezed.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
# No daemon in CI: a runner is used once, so a daemon is a process to start and
# then throw away.
org.gradle.daemon=false
# Both of these were the template's defaults, and both cost wall-clock time on
# every run: tasks that do not depend on each other now run together, and a task
# whose inputs have not changed is not run again. A change to the native code
# invalidates less of the build with these on.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
