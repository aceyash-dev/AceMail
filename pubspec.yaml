name: ace_mail
description: A fast, native IMAP/SMTP mail client for mobile and desktop.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  enough_mail: ^2.1.6
  file_selector: ^1.0.3
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  provider: ^6.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
