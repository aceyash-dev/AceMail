name: ace_mail
description: A fast, native IMAP/SMTP mail client for mobile and desktop.
publish_to: "none"
version: 0.6.0+78

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  # New-mail notifications. The notifications plugin draws them; workmanager is
  # what runs the check when the app is not open — a timer would only fire while
  # you were already looking at your mail.
  flutter_local_notifications: ^22.3.2
  workmanager: ^0.10.10
  # Pinned below 2.0: from 2.0 this package depends on `material_ui`, a parallel
  # Material implementation whose ColorScheme is a different type from
  # Flutter's — which makes DynamicColorBuilder unusable with a normal
  # MaterialApp. 1.9.0 uses Flutter's own.
  dynamic_color: ^1.9.0
  hugeicons: ^1.2.0
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  # Translation talks to an HTTP endpoint, and this says so rather than
  # borrowing the copy enough_mail brings with it.
  http: ^1.2.0
  enough_mail: ^2.1.6
  file_selector: ^1.0.3
  flutter_secure_storage: ^10.3.4
  # Signing in to Google, for the one provider that no longer accepts a
  # password. Gmail still speaks IMAP and SMTP, but only with an OAuth access
  # token, and the app password route was closed in 2022.
  google_sign_in: ^7.2.0
  # Unlocking the app. Nothing else: the keychain is what holds the vault
  # key, and a prompt is what asks for a fingerprint or a face.
  local_auth: ^3.0.2
  # The directory the encrypted cache lives in. Also the only thing here
  # that touches the filesystem.
  path_provider: ^2.1.6
  # AES-256-GCM for the local cache. Already present through enough_mail;
  # named here because the vault depends on it directly.
  pointycastle: ^4.0.0
  flutter_svg: ^2.0.10
  # Reading the provider logos in a test, so a malformed one fails the build
  # rather than the screen. Already present through the HTML renderer; named
  # here because a test depends on it directly.
  xml: ^6.6.1
  # The HTML renderer. Mail is HTML, and mail HTML is a museum of it: nested
  # layout tables, inline styles, unclosed tags, quoted-printable. This is the
  # renderer the Flutter ecosystem settled on and it is still maintained,
  # which a hand-written one here was not.
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.5
  package_info_plus: ^10.2.2
  provider: ^6.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Without this block none of these reach the app at all: Flutter bundles only
  # what is declared, and a font list is not an asset list. The mark, the
  # provider logos and the changelog all failed silently in 0.5.0 because this
  # was missing — and a missing asset is an exception at runtime, not a build
  # error, which is why it shipped.
  assets:
    - assets/brand/
    - assets/providers/
    - assets/CHANGELOG.md

  # Questrial ships a single weight, so only Regular is bundled.
  fonts:
    # Geograph, from the Typace foundry — the app's typeface.
    - family: Geograph
      fonts:
        - asset: assets/fonts/Geograph.ttf
          weight: 400
    # Kept as the fallback: Geograph is a Latin face, and a subject line can
    # arrive in any script.
    - family: Questrial
      fonts:
        - asset: assets/fonts/Questrial-Regular.ttf
          weight: 400
